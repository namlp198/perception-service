camera:
  type: realsense
  serial: ""
  capture_timeout_ms: 1000
  reconnect_interval_ms: 2000
  rgb: { enabled: true, width: 640, height: 480, fps: 30 }
  depth: { enabled: true, width: 640, height: 480, fps: 30 }
  infrared_left: { enabled: false, width: 640, height: 480, fps: 30 }
  infrared_right: { enabled: false, width: 640, height: 480, fps: 30 }
  imu:
    enabled: true
    accelerometer_fps: 100
    gyroscope_fps: 200
    queue_capacity: 512
    startup_timeout_ms: 2000
    liveness_timeout_ms: 1000
    restart_interval_ms: 30000
