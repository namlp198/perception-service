camera:
  type: realsense
  serial: ""
  capture_timeout_ms: 1000
  reconnect_interval_ms: 2000
  rgb: { enabled: true, width: 640, height: 480, fps: 30 }
  depth: { enabled: true, width: 640, height: 480, fps: 30 }
  infrared_left: { enabled: true, width: 640, height: 480, fps: 30 }
  infrared_right: { enabled: true, width: 640, height: 480, fps: 30 }
  imu:
    enabled: true
    accelerometer_fps: 100
    gyroscope_fps: 200
    queue_capacity: 512

streaming:
  rtsp:
    enabled: true
    bind_address: "0.0.0.0"
    port: 8554
    hardware_encoder: true
    allow_software_fallback: true
    bitrate_kbps: 4000
    keyframe_interval: 30
    queue_capacity: 3
    rgb: { enabled: true, path: "/camera/rgb" }
    infrared_left: { enabled: true, path: "/camera/ir_left" }
    infrared_right: { enabled: true, path: "/camera/ir_right" }
    depth_visual: { enabled: false, path: "/camera/depth_visual" }

robot_agent:
  enabled: false
  host: "192.168.1.206"
  port: 0
