camera:
  type: realsense
  serial: ""
  capture_timeout_ms: 1000
  reconnect_interval_ms: 2000
  rgb: { enabled: true, width: 640, height: 480, fps: 30 }
  depth: { enabled: true, width: 640, height: 480, fps: 30 }
  infrared_left: { enabled: false, width: 640, height: 480, fps: 30 }
  infrared_right: { enabled: false, width: 640, height: 480, fps: 30 }
  imu:
    enabled: true
    accelerometer_fps: 100
    gyroscope_fps: 200
    queue_capacity: 512
    startup_timeout_ms: 2000
    liveness_timeout_ms: 1000
    restart_interval_ms: 30000

streaming:
  rtsp:
    enabled: true
    bind_address: "0.0.0.0"
    port: 8554
    hardware_encoder: false
    allow_software_fallback: true
    bitrate_kbps: 4000
    keyframe_interval: 30
    queue_capacity: 3
    session_timeout_s: 20
    rgb: { enabled: true, path: "/camera/rgb" }
    infrared_left: { enabled: false, path: "/camera/ir_left" }
    infrared_right: { enabled: false, path: "/camera/ir_right" }
    depth_visual: { enabled: true, path: "/camera/depth_visual", min_distance_m: 0.2, max_distance_m: 5.0 }

robot_agent:
  enabled: false
  host: "192.168.1.206"
  port: 0

# Typed, versioned perception <-> mission boundary (protocol version 1).
#
# The listener is enabled: it is inert until something calls it and it answers health and
# localization queries. The two poll clients stay disabled because enabling them adds a 5 Hz request
# load to live mission services (payload-service serves the robot's RTK, robot-agent runs missions)
# for a consumer that does not exist until the V0.5 EKF. Enable them deliberately, per test.
transport:
  enabled: true
  bind_address: "0.0.0.0"
  port: 50053
  request_timeout_ms: 5000
  max_request_bytes: 65536
  # GNSS/RTK is read straight from payload-service. Routing it through robot-agent would add a
  # second hop to the one measurement whose timestamp and age the state estimator depends on.
  payload_service:
    enabled: false
    host: "192.168.1.206"
    port: 50052
    poll_interval_ms: 200
    request_timeout_ms: 1000
    staleness_timeout_ms: 2000
  # Vendor heading/odometry still comes from robot-agent, which owns the quadruped link.
  robot_agent_status:
    enabled: false
    host: "192.168.1.206"
    port: 5080
    poll_interval_ms: 200
    request_timeout_ms: 1000
    staleness_timeout_ms: 2000

# Rigid geometry of the sensor on the robot. These are survey values, not tuning knobs: a wrong
# mount silently rotates or shifts every point the perception and localization branches consume.
# Angles follow the same Z-Y-X (yaw, pitch, roll) convention as the vendor's attitude report, and
# describe the camera BODY frame (x forward, y left, z up) relative to base_link. The fixed optical
# -> body axis swap is applied in code, not configured here.
geometry:
  camera_mount:
    x_m: 0.0
    y_m: 0.0
    z_m: 0.0
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0
  point_cloud:
    min_range_m: 0.2
    max_range_m: 5.0
    row_stride: 1
    column_stride: 1
